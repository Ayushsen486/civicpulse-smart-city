server:
  port: 8080

spring:
  application:
    name: civicpulse-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civicpulse}
    username: ${SPRING_DATASOURCE_USERNAME:civicpulse}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme_local_only}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

civicpulse:
  jwt:
    # 256-bit base64 encoded secret for HMAC-SHA256
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # 15 minutes TTL per AGENTS.md rule 3
    access-token-expiration-ms: 900000
    # 7 days TTL per AGENTS.md rule 3
    refresh-token-expiration-ms: 604800000
  auth:
    google:
      # Optional audience enforcement for Google ID tokens (leave blank in dev or set to client ID)
      client-id: ${GOOGLE_CLIENT_ID:1024729300393-461mvfgdra4p5mfq1lfesro7inihqs5a.apps.googleusercontent.com}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
